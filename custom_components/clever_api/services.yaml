enable_flex:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: clever_api
    departure_time:
      required: true
      example: "07:00"
      selector:
        text:
          type: text
    required_energy:
      required: true
      example: 30
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: kWh
          mode: box

disable_flex:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: clever_api
